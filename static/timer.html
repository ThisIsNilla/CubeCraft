<main class='w-full flex-1 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 flex flex-col gap-8'>
<div class="bg-white rounded-2xl p-8 border border-slate-200/80 shadow-xs flex flex-col items-center justify-center min-h-[60vh] relative">
  
  <div class="absolute top-8 w-full text-center px-4">
    <p class="text-slate-500 font-bold mb-2">SCRAMBLE</p>
    <p class="text-xl font-code-mono font-bold text-slate-800" id="scramble-text">R U R' F' U2 L' B R' U' L2 F2 L2 B2 U' B2 U F2 D2</p>
    <button onclick="generateScramble()" class="mt-3 px-3 py-1 rounded bg-slate-100 hover:bg-slate-200 text-xs font-bold text-slate-600 transition-colors">Next Scramble</button>
  </div>

  <div class="mt-20 flex flex-col items-center">
    <div class="text-[120px] font-code-mono font-black text-slate-800 tabular-nums tracking-tighter leading-none" id="timer-display">0.00</div>
    <p class="text-slate-400 font-bold tracking-widest uppercase mt-4" id="timer-instruction">Hold SPACEBAR to start</p>
  </div>

</div>

<script>
  let timerElement = document.getElementById('timer-display');
  let instructionElement = document.getElementById('timer-instruction');
  let scrambleText = document.getElementById('scramble-text');
  
  let state = 'idle'; // idle, ready, running
  let startTime = 0;
  let interval = null;

  function formatTime(ms) {
    let seconds = ms / 1000;
    return seconds.toFixed(2);
  }

  function generateScramble() {
    const moves = ["R", "U", "F", "B", "L", "D", "R'", "U'", "F'", "B'", "L'", "D'", "R2", "U2", "F2", "B2", "L2", "D2"];
    let scramble = [];
    for(let i=0; i<20; i++) scramble.push(moves[Math.floor(Math.random() * moves.length)]);
    scrambleText.innerText = scramble.join(" ");
  }

  document.addEventListener('keydown', (e) => {
    if (e.code === 'Space') {
      if (state === 'idle') {
        state = 'ready';
        timerElement.style.color = '#10b981'; // emerald-500
        instructionElement.innerText = 'Release to start';
      } else if (state === 'running') {
        state = 'idle';
        clearInterval(interval);
        instructionElement.innerText = 'Hold SPACEBAR to start';
      }
    }
  });

  document.addEventListener('keyup', (e) => {
    if (e.code === 'Space') {
      if (state === 'ready') {
        state = 'running';
        startTime = Date.now();
        timerElement.style.color = '#0f172a'; // slate-800
        instructionElement.innerText = 'Press SPACEBAR to stop';
        interval = setInterval(() => {
          timerElement.innerText = formatTime(Date.now() - startTime);
        }, 10);
      }
    }
  });
</script>
